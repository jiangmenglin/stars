<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
  }
  .game-wrapper {
    display: flex; gap: 30px; align-items: flex-start;
    padding: 20px; background: #16213e; border-radius: 16px;
    box-shadow: 0 0 40px rgba(0,0,0,.5);
  }
  .board-section { text-align: center; }
  canvas#board {
    display: block; background: #0f3460; border-radius: 8px;
    box-shadow: inset 0 0 10px rgba(0,0,0,.5);
  }
  .info-panel { min-width: 160px; display: flex; flex-direction: column; gap: 16px; }
  .info-box {
    background: #0f3460; border-radius: 10px; padding: 14px 18px; text-align: center;
  }
  .info-box h3 { font-size: 13px; color: #aaa; margin-bottom: 6px; }
  .info-box .value { font-size: 26px; font-weight: bold; color: #e94560; }
  .info-box canvas#next { background: #0a2647; border-radius: 6px; margin-top: 4px; }
  .controls {
    display: flex; flex-direction: column; gap: 6px; margin-top: 8px;
  }
  .controls button {
    padding: 10px; border: none; border-radius: 8px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: transform .1s, opacity .2s;
  }
  .controls button:hover { transform: scale(1.03); }
  .controls button:active { transform: scale(.97); }
  .btn-restart { background: #e94560; color: #fff; }
  .btn-pause  { background: #533483; color: #fff; }
  .key-hint {
    font-size: 12px; color: #888; line-height: 1.7; text-align: center;
    margin-top: 4px;
  }
  .key-hint kbd {
    background: #0a2647; color: #eee; padding: 2px 7px; border-radius: 4px;
    font-size: 11px;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; justify-content: center; align-items: center; z-index: 100;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: #16213e; padding: 40px 50px; border-radius: 16px; text-align: center;
  }
  .overlay-box h2 { font-size: 36px; margin-bottom: 10px; }
  .overlay-box p { font-size: 18px; color: #ccc; margin-bottom: 20px; }
  .overlay-box .score { color: #e94560; font-size: 28px; font-weight: bold; }
  .overlay-box button {
    margin-top: 10px; padding: 12px 36px; border: none; border-radius: 10px;
    background: #e94560; color: #fff; font-size: 18px; font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="board-section">
    <canvas id="board" width="300" height="600"></canvas>
  </div>
  <div class="info-panel">
    <div class="info-box">
      <h3>得分</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="info-box">
      <h3>等级</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="info-box">
      <h3>已消行</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="info-box">
      <h3>下一个</h3>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="controls">
      <button class="btn-pause" id="pauseBtn">⏸ 暂停</button>
      <button class="btn-restart" id="restartBtn">↻ 重新开始</button>
    </div>
    <div class="key-hint">
      <kbd>←</kbd> <kbd>→</kbd> 移动 &nbsp; <kbd>↑</kbd> 旋转<br>
      <kbd>↓</kbd> 加速 &nbsp; <kbd>Space</kbd> 直接落下
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2>💀 游戏结束</h2>
    <p>最终得分</p>
    <div class="score" id="finalScore">0</div>
    <button id="overlayRestart">再来一局</button>
  </div>
</div>

<script>
// ======================== 俄罗斯方块核心 ========================
const COLS = 10, ROWS = 20, BLOCK = 30;
const $ = id => document.getElementById(id);
const boardCanvas = $('board'), boardCtx = boardCanvas.getContext('2d');
const nextCanvas = $('next'), nextCtx = nextCanvas.getContext('2d');

// 七种方块形状
const SHAPES = [
  // I
  { blocks: [[1,1,1,1]], color: '#00f0f0' },
  // O
  { blocks: [[1,1],[1,1]], color: '#f0f000' },
  // T
  { blocks: [[0,1,0],[1,1,1]], color: '#a000f0' },
  // S
  { blocks: [[0,1,1],[1,1,0]], color: '#00f000' },
  // Z
  { blocks: [[1,1,0],[0,1,1]], color: '#f00000' },
  // L
  { blocks: [[1,0,0],[1,1,1]], color: '#f0a000' },
  // J
  { blocks: [[0,0,1],[1,1,1]], color: '#0000f0' },
];

// ======================== 游戏状态 ========================
let board = [], currentPiece = null, nextPiece = null;
let score = 0, lines = 0, level = 1;
let gameOver = false, paused = false;
let dropInterval = null, animationId = null;
let lastDropTime = 0;

function createBoard() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
}

function randomPiece() {
  const idx = Math.floor(Math.random() * SHAPES.length);
  const shape = SHAPES[idx];
  return {
    blocks: shape.blocks.map(row => [...row]),
    color: shape.color,
    x: Math.floor((COLS - shape.blocks[0].length) / 2),
    y: 0,
  };
}

function rotateMatrix(matrix) {
  const rows = matrix.length, cols = matrix[0].length;
  const result = Array.from({ length: cols }, (_, c) =>
    Array.from({ length: rows }, (_, r) => matrix[rows - 1 - r][c])
  );
  return result;
}

function isValid(piece, dx = 0, dy = 0, newBlocks = null) {
  const blocks = newBlocks || piece.blocks;
  for (let r = 0; r < blocks.length; r++) {
    for (let c = 0; c < blocks[0].length; c++) {
      if (!blocks[r][c]) continue;
      const nx = piece.x + c + dx;
      const ny = piece.y + r + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
      if (ny < 0) continue;
      if (board[ny][nx]) return false;
    }
  }
  return true;
}

function lockPiece() {
  const p = currentPiece;
  for (let r = 0; r < p.blocks.length; r++) {
    for (let c = 0; c < p.blocks[0].length; c++) {
      if (!p.blocks[r][c]) continue;
      const bx = p.x + c, by = p.y + r;
      if (by < 0) { gameOver = true; showOverlay(); return; }
      board[by][bx] = p.color;
    }
  }
  clearLines();
  spawnPiece();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell !== 0)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
      cleared++;
      r++; // 重新检查当前行
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];
    score += (points[cleared] || cleared * 200) * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    updateInfo();
    resetDropTimer();
  }
}

function spawnPiece() {
  currentPiece = nextPiece || randomPiece();
  nextPiece = randomPiece();
  drawNext();
  if (!isValid(currentPiece)) {
    gameOver = true;
    showOverlay();
  }
}

// ======================== 绘制 ========================
function drawBlock(ctx, x, y, color, size = BLOCK) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.fillRect(x * size + 1, y * size + 1, size - 2, 3);
  ctx.fillRect(x * size + 1, y * size + 1, 3, size - 2);
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect((x + 1) * size - 3, y * size + 1, 2, size - 2);
  ctx.fillRect(x * size + 1, (y + 1) * size - 3, size - 2, 2);
}

function draw() {
  // 清空
  boardCtx.fillStyle = '#0f3460';
  boardCtx.fillRect(0, 0, 300, 600);
  boardCtx.strokeStyle = 'rgba(255,255,255,.04)';
  boardCtx.lineWidth = 1;

  // 网格线
  for (let r = 0; r <= ROWS; r++) {
    boardCtx.beginPath();
    boardCtx.moveTo(0, r * BLOCK);
    boardCtx.lineTo(300, r * BLOCK);
    boardCtx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    boardCtx.beginPath();
    boardCtx.moveTo(c * BLOCK, 0);
    boardCtx.lineTo(c * BLOCK, 600);
    boardCtx.stroke();
  }

  // 已固定的方块
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawBlock(boardCtx, c, r, board[r][c]);
    }
  }

  // 当前方块
  if (currentPiece && !gameOver) {
    const p = currentPiece;
    // 投影（ghost）
    let ghostY = p.y;
    while (isValid(p, 0, ghostY - p.y + 1)) ghostY++;
    for (let r = 0; r < p.blocks.length; r++) {
      for (let c = 0; c < p.blocks[0].length; c++) {
        if (!p.blocks[r][c]) continue;
        const gx = p.x + c, gy = ghostY + r;
        if (gy < 0 || gy >= ROWS) continue;
        boardCtx.fillStyle = 'rgba(255,255,255,.1)';
        boardCtx.fillRect(gx * BLOCK + 2, gy * BLOCK + 2, BLOCK - 4, BLOCK - 4);
      }
    }
    // 实体
    for (let r = 0; r < p.blocks.length; r++) {
      for (let c = 0; c < p.blocks[0].length; c++) {
        if (!p.blocks[r][c]) continue;
        drawBlock(boardCtx, p.x + c, p.y + r, p.color);
      }
    }
  }
}

function drawNext() {
  nextCtx.fillStyle = '#0a2647';
  nextCtx.fillRect(0, 0, 120, 120);
  if (!nextPiece) return;
  const blocks = nextPiece.blocks;
  const rows = blocks.length, cols = blocks[0].length;
  const size = 24;
  const ox = (120 - cols * size) / 2;
  const oy = (120 - rows * size) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!blocks[r][c]) continue;
      nextCtx.fillStyle = nextPiece.color;
      nextCtx.fillRect(ox + c * size + 1, oy + r * size + 1, size - 2, size - 2);
    }
  }
}

// ======================== 输入 ========================
function moveLeft()   { if (!gameOver && !paused && currentPiece && isValid(currentPiece, -1)) { currentPiece.x--; draw(); }}
function moveRight()  { if (!gameOver && !paused && currentPiece && isValid(currentPiece, 1)) { currentPiece.x++; draw(); }}
function moveDown()   { if (!gameOver && !paused && currentPiece) { if (isValid(currentPiece, 0, 1)) { currentPiece.y++; draw(); } else { lockPiece(); draw(); }}}
function rotate()     {
  if (gameOver || paused || !currentPiece) return;
  const rotated = rotateMatrix(currentPiece.blocks);
  if (isValid(currentPiece, 0, 0, rotated)) {
    currentPiece.blocks = rotated;
  } else {
    // 墙踢
    for (const kick of [-1, 1, -2, 2]) {
      if (isValid(currentPiece, kick, 0, rotated)) {
        currentPiece.x += kick;
        currentPiece.blocks = rotated;
        break;
      }
    }
  }
  draw();
}
function hardDrop() {
  if (gameOver || paused || !currentPiece) return;
  let dy = 0;
  while (isValid(currentPiece, 0, dy + 1)) dy++;
  currentPiece.y += dy;
  lockPiece();
  draw();
  resetDropTimer();
}

// ======================== 计时器 ========================
function getDropInterval() {
  return Math.max(80, 800 - (level - 1) * 60);
}

function resetDropTimer() {
  lastDropTime = performance.now();
}

function gameLoop(time) {
  if (gameOver || paused) {
    animationId = requestAnimationFrame(gameLoop);
    return;
  }
  const interval = getDropInterval();
  if (time - lastDropTime > interval) {
    if (isValid(currentPiece, 0, 1)) {
      currentPiece.y++;
    } else {
      lockPiece();
    }
    draw();
    lastDropTime = time;
  }
  updateInfo();
  animationId = requestAnimationFrame(gameLoop);
}

// ======================== UI ========================
function updateInfo() {
  $('score').textContent = score;
  $('level').textContent = level;
  $('lines').textContent = lines;
}

function showOverlay() {
  $('finalScore').textContent = score;
  $('overlay').classList.add('show');
}

function hideOverlay() {
  $('overlay').classList.remove('show');
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  $('pauseBtn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
  if (!paused) resetDropTimer();
  draw();
}

function restart() {
  hideOverlay();
  createBoard();
  score = 0; lines = 0; level = 1;
  gameOver = false; paused = false;
  $('pauseBtn').textContent = '⏸ 暂停';
  spawnPiece();
  updateInfo();
  resetDropTimer();
  draw();
}

// ======================== 键盘 ========================
document.addEventListener('keydown', e => {
  if (e.repeat && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown')) {
    // 按住时只触发降速，不处理
  }
  switch (e.key) {
    case 'ArrowLeft':  e.preventDefault(); moveLeft();  break;
    case 'ArrowRight': e.preventDefault(); moveRight(); break;
    case 'ArrowDown':  e.preventDefault(); moveDown();  break;
    case 'ArrowUp':    e.preventDefault(); rotate();    break;
    case ' ':          e.preventDefault(); hardDrop();  break;
    case 'p':
    case 'P':          e.preventDefault(); togglePause(); break;
  }
});

// 按住方向键连续移动
let keyRepeatInterval = null;
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    clearInterval(keyRepeatInterval);
    keyRepeatInterval = setInterval(() => {
      if (e.key === 'ArrowLeft') moveLeft();
      else if (e.key === 'ArrowRight') moveRight();
      else if (e.key === 'ArrowDown') moveDown();
    }, 100);
  }
});
document.addEventListener('keyup', () => { clearInterval(keyRepeatInterval); keyRepeatInterval = null; });

// ======================== 按钮 ========================
$('pauseBtn').addEventListener('click', togglePause);
$('restartBtn').addEventListener('click', restart);
$('overlayRestart').addEventListener('click', restart);

// ======================== 启动 ========================
createBoard();
spawnPiece();
updateInfo();
resetDropTimer();
draw();
animationId = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
