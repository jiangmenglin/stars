<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>魔方 - Rubik's Cube</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}
canvas { display: block; }

#ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
}
#ui > * { pointer-events: auto; }

#top-bar {
    display: flex;
    justify-content: space-between;
    padding: 16px 20px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
}
#top-bar > div {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
}

#bottom-bar {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
}
#bottom-bar button {
    pointer-events: auto;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 80px;
}
#bottom-bar button:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-1px);
}
#bottom-bar button:active {
    transform: translateY(0);
    background: rgba(255,255,255,0.05);
}
#bottom-bar button.primary {
    background: rgba(76, 175, 80, 0.3);
    border-color: rgba(76, 175, 80, 0.4);
}
#bottom-bar button.primary:hover {
    background: rgba(76, 175, 80, 0.5);
}

#move-buttons {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
}
#move-buttons button {
    pointer-events: auto;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #aaa;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Courier New', monospace;
}
#move-buttons button:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
}
#move-buttons button.ccw::after {
    content: "'";
    color: #ff6b6b;
}

#hint {
    position: absolute;
    bottom: 160px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 13px;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.5s;
}
#hint.hidden { opacity: 0; }

@media (max-width: 600px) {
    #top-bar { padding: 12px; font-size: 15px; }
    #top-bar > div { padding: 6px 12px; }
    #bottom-bar { bottom: 20px; gap: 8px; }
    #bottom-bar button { padding: 8px 16px; font-size: 13px; min-width: 60px; }
    #move-buttons { bottom: 75px; gap: 4px; }
    #move-buttons button { padding: 4px 8px; font-size: 11px; }
    #hint { bottom: 140px; font-size: 11px; }
}
</style>
</head>
<body>

<div id="ui">
    <div id="top-bar">
        <div id="moves-display">步数: 0</div>
        <div id="timer-display">00:00</div>
    </div>

    <div id="hint">点击拖拽旋转面 · 滚轮缩放 · 右键旋转视角</div>

    <div id="move-buttons">
        <button data-move="R">R</button>
        <button data-move="R'" class="ccw">R</button>
        <button data-move="L">L</button>
        <button data-move="L'" class="ccw">L</button>
        <button data-move="U">U</button>
        <button data-move="U'" class="ccw">U</button>
        <button data-move="D">D</button>
        <button data-move="D'" class="ccw">D</button>
        <button data-move="F">F</button>
        <button data-move="F'" class="ccw">F</button>
        <button data-move="B">B</button>
        <button data-move="B'" class="ccw">B</button>
    </div>

    <div id="bottom-bar">
        <button id="scramble-btn" class="primary">打乱</button>
        <button id="reset-btn">重置</button>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Colors ─────────────────────────────────────────────
const C = {
    RIGHT: 0xB71234,   // Red
    LEFT:  0xFF5800,    // Orange
    UP:    0xFFFFFF,    // White
    DOWN:  0xFFD500,    // Yellow
    FRONT: 0x009E60,    // Green
    BACK:  0x0051BA,    // Blue
    INNER: 0x111111,
    BODY:  0x0a0a0a,
};

// Move definitions: { axis, layer, angle }
const MOVE_DEFS = {
    'R':  { axis: 'x', layer:  1, angle:  1 },
    "R'": { axis: 'x', layer:  1, angle: -1 },
    'L':  { axis: 'x', layer: -1, angle: -1 },
    "L'": { axis: 'x', layer: -1, angle:  1 },
    'U':  { axis: 'y', layer:  1, angle:  1 },
    "U'": { axis: 'y', layer:  1, angle: -1 },
    'D':  { axis: 'y', layer: -1, angle: -1 },
    "D'": { axis: 'y', layer: -1, angle:  1 },
    'F':  { axis: 'z', layer:  1, angle:  1 },
    "F'": { axis: 'z', layer:  1, angle: -1 },
    'B':  { axis: 'z', layer: -1, angle: -1 },
    "B'": { axis: 'z', layer: -1, angle:  1 },
};
const MOVE_KEYS = Object.keys(MOVE_DEFS);

// ─── Scene Setup ─────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.5, 3.5, 5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.minDistance = 4;
controls.maxDistance = 15;
controls.target.set(0, 0, 0);
controls.update();

// Lights
const ambientLight = new THREE.AmbientLight(0x404050, 0.6);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffffff, 1.8);
mainLight.position.set(5, 8, 6);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
fillLight.position.set(-4, -2, -5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
rimLight.position.set(-3, 5, -4);
scene.add(rimLight);

// ─── Cube ────────────────────────────────────────────────
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

let cubelets = [];
const CUBE_SIZE = 0.93;
const GAP = 1.0;

// Material indices for BoxGeometry: +x, -x, +y, -y, +z, -z
function faceColor(x, y, z, faceIdx) {
    switch (faceIdx) {
        case 0: return x ===  1 ? C.RIGHT : C.INNER;
        case 1: return x === -1 ? C.LEFT  : C.INNER;
        case 2: return y ===  1 ? C.UP    : C.INNER;
        case 3: return y === -1 ? C.DOWN  : C.INNER;
        case 4: return z ===  1 ? C.FRONT : C.INNER;
        case 5: return z === -1 ? C.BACK  : C.INNER;
    }
}

function createCubelet(x, y, z) {
    const geo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
    const mats = [];
    for (let i = 0; i < 6; i++) {
        mats.push(new THREE.MeshStandardMaterial({
            color: faceColor(x, y, z, i),
            roughness: i < 6 ? 0.25 : 0.9,
            metalness: i < 6 ? 0.05 : 0,
        }));
    }
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set(x * GAP, y * GAP, z * GAP);
    mesh.castShadow = true;
    return mesh;
}

function buildCube() {
    // Remove old
    while (cubeGroup.children.length) {
        const child = cubeGroup.children[0];
        child.geometry?.dispose();
        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
        else child.material?.dispose();
        cubeGroup.remove(child);
    }
    cubelets = [];

    for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
            for (let z = -1; z <= 1; z++) {
                const mesh = createCubelet(x, y, z);
                cubeGroup.add(mesh);
                cubelets.push(mesh);
            }
        }
    }
}

buildCube();

// ─── State ───────────────────────────────────────────────
let isAnimating = false;
let moveCount = 0;
let timerRunning = false;
let timerStart = 0;
let timerElapsed = 0;
let timerRAF = null;
let isScrambled = false;
let scrambleQueue = [];
let isScrambling = false;

const moveHistory = [];

function updateMovesDisplay() {
    document.getElementById('moves-display').textContent = `步数: ${moveCount}`;
}

function updateTimerDisplay() {
    const total = Math.floor(timerElapsed / 1000);
    const min = String(Math.floor(total / 60)).padStart(2, '0');
    const sec = String(total % 60).padStart(2, '0');
    document.getElementById('timer-display').textContent = `${min}:${sec}`;
}

function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    timerStart = performance.now() - timerElapsed;
    function tick() {
        timerElapsed = performance.now() - timerStart;
        updateTimerDisplay();
        timerRAF = requestAnimationFrame(tick);
    }
    tick();
}

function stopTimer() {
    timerRunning = false;
    if (timerRAF) cancelAnimationFrame(timerRAF);
    timerRAF = null;
}

function resetTimer() {
    stopTimer();
    timerElapsed = 0;
    updateTimerDisplay();
}

// ─── Face Rotation ──────────────────────────────────────
const AXIS_VECTORS = {
    x: new THREE.Vector3(1, 0, 0),
    y: new THREE.Vector3(0, 1, 0),
    z: new THREE.Vector3(0, 0, 1),
};

function getAffectedCubelets(axis, layer) {
    const av = AXIS_VECTORS[axis];
    const result = [];
    for (const c of cubeGroup.children) {
        const coord = Math.round(av.dot(c.position));
        if (coord === layer) result.push(c);
    }
    return result;
}

function rotateFace(axis, layer, angleSign, animated = true) {
    return new Promise(resolve => {
        if (isAnimating) { resolve(); return; }
        isAnimating = true;

        const affected = getAffectedCubelets(axis, layer);
        const axisVec = AXIS_VECTORS[axis];
        const angle = angleSign * Math.PI / 2;

        // If only center piece or no pieces, skip
        if (affected.length === 0) { isAnimating = false; resolve(); return; }

        const pivot = new THREE.Group();
        cubeGroup.add(pivot);

        for (const c of affected) {
            cubeGroup.remove(c);
            pivot.attach(c);
        }

        const startQuat = pivot.quaternion.clone();
        const endQuat = new THREE.Quaternion().setFromAxisAngle(axisVec, angle);
        endQuat.multiply(startQuat);

        if (!animated) {
            pivot.quaternion.copy(endQuat);
            pivot.updateMatrixWorld(true);
            for (const c of affected) {
                cubeGroup.attach(c);
            }
            cubeGroup.remove(pivot);
            roundPositions();
            isAnimating = false;
            resolve();
            return;
        }

        const duration = 180;
        const startTime = performance.now();

        function animateRotation() {
            const t = Math.min((performance.now() - startTime) / duration, 1);
            const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 3;
            pivot.quaternion.copy(startQuat).slerp(endQuat, eased);

            if (t < 1) {
                requestAnimationFrame(animateRotation);
            } else {
                pivot.quaternion.copy(endQuat);
                pivot.updateMatrixWorld(true);
                for (const c of affected) {
                    cubeGroup.attach(c);
                }
                cubeGroup.remove(pivot);
                roundPositions();
                isAnimating = false;
                resolve();
            }
        }
        animateRotation();
    });
}

function roundPositions() {
    for (const c of cubeGroup.children) {
        c.position.x = Math.round(c.position.x * 10) / 10;
        c.position.y = Math.round(c.position.y * 10) / 10;
        c.position.z = Math.round(c.position.z * 10) / 10;
    }
}

// ─── Execute a named move ────────────────────────────────
async function executeMove(name, animated = true) {
    const def = MOVE_DEFS[name];
    if (!def) return;
    await rotateFace(def.axis, def.layer, def.angle, animated);
}

async function executeMoves(names, animated = true) {
    for (const name of names) {
        await executeMove(name, animated);
    }
}

async function doMove(name) {
    if (isAnimating || isScrambling) return;
    if (!timerRunning && isScrambled) startTimer();

    await executeMove(name, true);

    moveCount++;
    updateMovesDisplay();
    moveHistory.push(name);
}

// ─── Scramble ────────────────────────────────────────────
function generateScramble(length = 22) {
    const moves = [];
    const faces = ['R', 'L', 'U', 'D', 'F', 'B'];
    let lastFace = '';
    let secondLastFace = '';

    for (let i = 0; i < length; i++) {
        let face;
        do {
            face = faces[Math.floor(Math.random() * faces.length)];
        } while (face === lastFace || (face === oppositeFace(lastFace) && lastFace === secondLastFace));

        const prime = Math.random() < 0.5 ? '' : "'";
        moves.push(face + prime);

        secondLastFace = lastFace;
        lastFace = face;
    }
    return moves;
}

function oppositeFace(face) {
    const map = { 'R': 'L', 'L': 'R', 'U': 'D', 'D': 'U', 'F': 'B', 'B': 'F' };
    return map[face] || '';
}

async function scramble() {
    if (isAnimating || isScrambling) return;
    isScrambling = true;
    resetTimer();
    moveCount = 0;
    updateMovesDisplay();
    moveHistory.length = 0;

    const moves = generateScramble(22);

    for (let i = 0; i < moves.length; i++) {
        const def = MOVE_DEFS[moves[i]];
        await rotateFace(def.axis, def.layer, def.angle, true);
    }

    isScrambled = true;
    isScrambling = false;
}

function resetCube() {
    if (isAnimating || isScrambling) return;
    isScrambled = false;
    moveCount = 0;
    moveHistory.length = 0;
    resetTimer();
    updateMovesDisplay();
    buildCube();
}

// ─── Drag Controls ──────────────────────────────────────
let dragState = null;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function getCubeletIntersects(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    pointer.set(x, y);
    raycaster.setFromCamera(pointer, camera);

    const meshes = cubeGroup.children.filter(c => c.isMesh);
    return raycaster.intersectObjects(meshes, false);
}

function getPointOnFace(intersect) {
    // Get the hit point on the face
    return intersect.point.clone();
}

function getFaceInfo(intersect) {
    const mesh = intersect.object;
    const normal = intersect.face.normal.clone();

    // Transform normal to world space (cubeGroup is at origin, no rotation)
    normal.applyQuaternion(mesh.quaternion);
    normal.round();

    // Determine axis from face normal
    let axis;
    const ax = Math.abs(normal.x);
    const ay = Math.abs(normal.y);
    const az = Math.abs(normal.z);
    if (ax > ay && ax > az) axis = 'x';
    else if (ay > az) axis = 'y';
    else axis = 'z';

    // Determine layer from cubelet position along axis
    const av = AXIS_VECTORS[axis];
    const layer = Math.round(av.dot(mesh.position));

    return { axis, layer, normal, mesh, point: intersect.point.clone() };
}

function handlePointerDown(event) {
    if (isAnimating || isScrambling) return;

    const clientX = event.clientX;
    const clientY = event.clientY;

    if (event.type === 'touchstart') {
        // Prevent default to avoid scrolling
    }

    const intersects = getCubeletIntersects(event);
    if (intersects.length === 0) return;

    const info = getFaceInfo(intersects[0]);

    dragState = {
        startX: clientX,
        startY: clientY,
        lastX: clientX,
        lastY: clientY,
        faceInfo: info,
        startPoint: info.point.clone(),
        moved: false,
    };

    // Disable orbit controls while dragging on cube
    controls.enableRotate = false;
}

function handlePointerMove(event) {
    if (!dragState) return;

    const clientX = event.clientX;
    const clientY = event.clientY;

    const dx = clientX - dragState.startX;
    const dy = clientY - dragState.startY;

    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        dragState.moved = true;
    }

    dragState.lastX = clientX;
    dragState.lastY = clientY;
}

function handlePointerUp(event) {
    if (!dragState) return;

    const state = dragState;
    dragState = null;
    controls.enableRotate = true;

    if (!state.moved) {
        // Click (no movement) — do nothing on click
        return;
    }

    const dx = state.lastX - state.startX;
    const dy = state.lastY - state.startY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 15) return; // too short

    // Determine rotation direction from drag
    const { axis, layer, normal, startPoint } = state.faceInfo;

    // Project current mouse position onto the same face
    const rect = renderer.domElement.getBoundingClientRect();
    const x = ((state.lastX - rect.left) / rect.width) * 2 - 1;
    const y = -((state.lastY - rect.top) / rect.height) * 2 + 1;
    pointer.set(x, y);
    raycaster.setFromCamera(pointer, camera);

    const meshes = cubeGroup.children.filter(c => c.isMesh);
    const intersects = raycaster.intersectObjects(meshes, false);

    let endPoint;
    if (intersects.length > 0) {
        endPoint = getPointOnFace(intersects[0]);
    } else {
        // Project the drag direction onto the face plane
        // Use screen-space direction as fallback
        const sign = getScreenDirection(state.startX, state.startY, state.lastX, state.lastY, axis, layer);
        if (sign === 0) return;
        doMoveByName(getMoveName(axis, layer, sign));
        return;
    }

    const sign = getRotationDirection(startPoint, endPoint, AXIS_VECTORS[axis], layer);
    if (sign === 0) return;

    doMoveByName(getMoveName(axis, layer, sign));
}

function getMoveName(axis, layer, sign) {
    // sign: 1 = CW, -1 = CCW
    for (const [name, def] of Object.entries(MOVE_DEFS)) {
        if (def.axis === axis && def.layer === layer && def.angle === sign) {
            return name;
        }
    }
    return null;
}

function getRotationDirection(start, end, normal) {
    // Project start and end onto the face plane
    const s = start.clone();
    const e = end.clone();
    const n = normal.clone();

    s.sub(n.clone().multiplyScalar(s.dot(n)));
    e.sub(n.clone().multiplyScalar(e.dot(n)));

    const drag = e.clone().sub(s);
    if (drag.length() < 0.02) return 0;

    // Method: cross product of radial and drag
    if (s.length() > 0.1) {
        const radial = s.clone().normalize();
        const tangential = new THREE.Vector3().crossVectors(radial, n).normalize();
        const tanComp = drag.dot(tangential);
        if (Math.abs(tanComp) > 0.02) return Math.sign(tanComp);
    }

    return 0;
}

function getScreenDirection(sx, sy, ex, ey, axis, layer) {
    // Fallback: use screen-space cross product
    const center = new THREE.Vector3(0, 0, 0);
    const av = AXIS_VECTORS[axis];
    center.add(av.clone().multiplyScalar(layer));

    const centerScreen = center.clone().project(camera);
    const cx = (centerScreen.x * 0.5 + 0.5) * window.innerWidth;
    const cy = (-centerScreen.y * 0.5 + 0.5) * window.innerHeight;

    const rx = sx - cx;
    const ry = sy - cy;
    const dx = ex - sx;
    const dy = ey - sy;

    const cross = rx * dy - ry * dx;
    if (Math.abs(cross) < 200) return 0;
    return cross > 0 ? 1 : -1;
}

async function doMoveByName(name) {
    if (!name || isAnimating || isScrambling) return;
    if (!timerRunning && isScrambled) startTimer();

    await executeMove(name, true);
    moveCount++;
    updateMovesDisplay();
    moveHistory.push(name);
}

// ─── Event Binding ──────────────────────────────────────
// Mouse
renderer.domElement.addEventListener('mousedown', handlePointerDown);
window.addEventListener('mousemove', handlePointerMove);
window.addEventListener('mouseup', handlePointerUp);

// Touch
let touchId = null;
renderer.domElement.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    touchId = t.identifier;
    handlePointerDown({ clientX: t.clientX, clientY: t.clientY, type: 'touchstart' });
}, { passive: false });

renderer.domElement.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier === touchId) {
            handlePointerMove({ clientX: t.clientX, clientY: t.clientY });
        }
    }
}, { passive: false });

renderer.domElement.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
        if (t.identifier === touchId) {
            touchId = null;
            handlePointerUp({ clientX: t.clientX, clientY: t.clientY });
        }
    }
});

// ─── Keyboard Controls ─────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    const key = e.key.toUpperCase();
    if (key === 'R' || key === 'L' || key === 'U' || key === 'D' || key === 'F' || key === 'B') {
        const name = e.shiftKey ? key + "'" : key;
        if (MOVE_DEFS[name]) doMoveByName(name);
    }
});

// ─── Button Controls ────────────────────────────────────
document.querySelectorAll('#move-buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
        const move = btn.dataset.move;
        if (move) doMoveByName(move);
    });
});

document.getElementById('scramble-btn').addEventListener('click', scramble);
document.getElementById('reset-btn').addEventListener('click', resetCube);

// ─── Resize ─────────────────────────────────────────────
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Render Loop ────────────────────────────────────────
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

// ─── Initial scramble for demo ─────────────────────────
setTimeout(() => scramble(), 500);

console.log('🧊 Rubik\'s Cube loaded!');
console.log('拖拽旋转面 · 滚轮缩放 · 右键旋转视角');
console.log('键盘: R/L/U/D/F/B (+Shift 逆时针)');

</script>
